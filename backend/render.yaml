services:
  - type: web
    name: crednex-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: crednex-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://crednex-portal.vercel.app

databases:
  - name: crednex-db
    region: oregon
    plan: free
    databaseName: crednex
    user: crednex_user
